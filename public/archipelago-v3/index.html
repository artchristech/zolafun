<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archipelago</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1c24; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6vh;
    background: radial-gradient(ellipse at 50% 55%, rgba(255, 190, 120, 0.10) 0%, rgba(30, 14, 26, 0.55) 100%);
    transition: opacity 1.8s ease; cursor: pointer; user-select: none;
  }
  #title.hidden { opacity: 0; pointer-events: none; }
  .emblem { width: min(30vh, 230px); height: auto; filter: drop-shadow(0 6px 22px rgba(0, 0, 0, 0.45)); }
  .glyphs { display: flex; gap: 34px; align-items: center; opacity: 0.22; transition: opacity 0.9s ease; }
  .glyphs.ready { opacity: 1; animation: pulse 2.6s ease-in-out infinite; }
  .glyphs svg { width: 64px; height: 64px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .spin { width: 22px; height: 22px; border: 3px solid rgba(255, 240, 220, 0.25); border-top-color: #ffe2b0; border-radius: 50%; animation: sp 1s linear infinite; }
  .glyphs.ready + .spin { display: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #prompt { position: fixed; left: 0; top: 0; pointer-events: none; transform: translate(-50%, -50%) scale(0.85); opacity: 0; transition: opacity 0.18s ease, transform 0.18s ease; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5)); }
  #prompt.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #fps { position: fixed; left: 8px; top: 6px; font: 12px/1.3 monospace; color: #fff; background: rgba(0, 0, 0, 0.4); padding: 2px 7px; border-radius: 4px; display: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="title">
  <svg class="emblem" viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4b5d9a"/><stop offset="0.55" stop-color="#f19a64"/><stop offset="1" stop-color="#ffd59a"/>
      </linearGradient>
      <clipPath id="clip"><circle cx="100" cy="100" r="92"/></clipPath>
    </defs>
    <g clip-path="url(#clip)">
      <rect width="200" height="200" fill="url(#sky)"/>
      <circle cx="128" cy="128" r="26" fill="#fff1c8"/>
      <path d="M0 132 Q30 118 60 128 T120 126 T200 124 V200 H0Z" fill="#3c2f4a"/>
      <g>
        <polygon points="86,58 114,58 118,132 82,132" fill="#f3efe6"/>
        <polygon points="85.3,72 114.7,72 115.5,86 84.5,86" fill="#c62f2a"/>
        <polygon points="83.8,100 116.2,100 117,114 83,114" fill="#c62f2a"/>
        <rect x="84" y="50" width="32" height="8" fill="#2b2624"/>
        <rect x="90" y="38" width="20" height="12" fill="#ffcf7a"/>
        <polygon points="86,38 114,38 100,24" fill="#c62f2a"/>
        <path d="M110 44 L200 30 L200 60 Z" fill="#ffe9b8" opacity="0.55"/>
      </g>
      <path d="M0 150 Q25 142 50 150 T100 150 T150 150 T200 150 V200 H0Z" fill="#1f5f86"/>
      <path d="M12 164 q10 -5 20 0 M70 172 q10 -5 20 0 M130 166 q10 -5 20 0 M160 180 q10 -5 20 0" stroke="#e8f6ff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <circle cx="100" cy="100" r="92" fill="none" stroke="#fff3dc" stroke-width="5"/>
  </svg>
  <div class="glyphs" id="glyphs">
    <svg viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="20" fill="#2f8f3a" stroke="#123b18" stroke-width="3"/><circle cx="23" cy="21" r="16" fill="#3fae4b"/><text x="23" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#fff">A</text></svg>
    <svg viewBox="0 0 46 46" aria-hidden="true"><rect x="10" y="4" width="26" height="38" rx="13" fill="#f6efe0" stroke="#3b2f28" stroke-width="3"/><path d="M11.5 18 V17 a11.5 11.5 0 0 1 11.5 -11.5 V18 Z" fill="#e0703a" stroke="#3b2f28" stroke-width="2"/><line x1="23" y1="5.5" x2="23" y2="18" stroke="#3b2f28" stroke-width="2"/><line x1="11.5" y1="18" x2="34.5" y2="18" stroke="#3b2f28" stroke-width="2"/></svg>
  </div>
  <div class="spin"></div>
</div>
<div id="prompt"></div>
<div id="fps"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
