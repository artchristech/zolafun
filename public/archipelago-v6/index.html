<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Lights</title>
<style>
  :root { --ink: #fff3dc; --glow: #ffd27a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120e1a; }
  canvas#game { display: block; width: 100vw; height: 100vh; outline: none; }
  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 11vh; pointer-events: auto; cursor: pointer; transition: opacity 1.5s ease;
    background: linear-gradient(to bottom, rgba(18,12,30,0) 45%, rgba(18,12,30,.55) 100%);
    user-select: none; -webkit-user-select: none;
  }
  #title.gone { opacity: 0; pointer-events: none; }
  #title h1 {
    margin: 0 0 .25em; font: 400 clamp(42px, 7vw, 96px)/1 Georgia, 'Times New Roman', serif; letter-spacing: .08em;
    color: var(--ink); text-shadow: 0 0 24px rgba(255,190,110,.65), 0 2px 0 rgba(60,30,20,.6);
  }
  #lights { display: flex; gap: 14px; margin-bottom: 4vh; }
  #lights i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 2px rgba(255,240,210,.35); }
  #lights i.on { background: var(--glow); box-shadow: 0 0 12px 3px rgba(255,180,80,.8); }
  #startGlyphs { display: flex; gap: 22px; opacity: .25; transition: opacity .8s; }
  #title.ready #startGlyphs { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.07); } }
  .g { width: 56px; height: 56px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  .g.s { width: 26px; height: 26px; }
  .key {
    min-width: 44px; height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: #f3ead8; color: #2b2119; font: 700 24px/1 Georgia, serif; box-shadow: 0 4px 0 #8c7a62, 0 6px 12px rgba(0,0,0,.45);
  }
  .key.s { min-width: 24px; height: 24px; font-size: 14px; border-radius: 5px; padding: 0 5px; box-shadow: 0 2px 0 #8c7a62; }
  #resetBox { position: fixed; right: 4vw; bottom: 5vh; display: none; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
  #resetBox .reset { width: 64px; height: 64px; }
  #resetBox .mini { display: flex; gap: 8px; align-items: center; opacity: .8; }
  #prompt { position: fixed; left: 0; top: 0; opacity: 0; transition: opacity .2s; pointer-events: none; filter: drop-shadow(0 0 10px rgba(255,200,120,.6)); }
  #prompt .g { width: 46px; height: 46px; }
  #stats {
    position: fixed; left: 10px; top: 10px; display: none; padding: 6px 9px; border-radius: 6px; white-space: pre;
    background: rgba(10,8,16,.6); color: #e9f3ff; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="title">
  <h1>Five Lights</h1>
  <div id="lights"></div>
  <div id="startGlyphs"></div>
</div>
<div id="resetBox"></div>
<div id="prompt"></div>
<div id="stats"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
