<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f3a55e" />
<title>Five Lights</title>
<style>
  :root {
    --ink: #1c2233;
    --paper: #fff4dc;
    --ember: #ffb347;
    --ember-hot: #fff1b8;
    --glass: rgba(255, 244, 220, 0.14);
    --glass-edge: rgba(255, 244, 220, 0.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1c2233;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    color: var(--paper);
    overscroll-behavior: none;
  }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- HUD ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #lights {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); display: flex; gap: 12px; opacity: 0.9;
  }
  #lights i {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid var(--glass-edge); background: rgba(0,0,0,0.15);
    transition: background .8s, box-shadow .8s, border-color .8s;
  }
  #lights i.lit {
    background: var(--ember-hot); border-color: var(--ember);
    box-shadow: 0 0 10px 3px rgba(255, 180, 71, 0.8);
  }
  #act {
    position: absolute; right: calc(28px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom));
    width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid var(--glass-edge); background: var(--glass);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: grid; place-items: center; pointer-events: auto;
    opacity: 0; transform: scale(.6); transition: opacity .25s, transform .25s;
  }
  #act.show { opacity: 1; transform: scale(1); animation: breathe 1.8s ease-in-out infinite; }
  #act.show:active { transform: scale(.92); }
  #act svg { width: 42px; height: 42px; }
  @keyframes breathe { 50% { box-shadow: 0 0 22px 4px rgba(255, 190, 110, .45); } }

  #stick {
    position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid var(--glass-edge); background: var(--glass); opacity: 0; transition: opacity .2s;
  }
  #stick.on { opacity: .8; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px;
    border-radius: 50%; background: rgba(255, 244, 220, .55);
  }
  #mute {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    width: 40px; height: 40px; border: 0; background: none; pointer-events: auto; opacity: .7; padding: 8px;
  }
  #mute svg { width: 24px; height: 24px; }

  #fade {
    position: fixed; inset: 0; background: #0b1024; opacity: 0; pointer-events: none; transition: opacity .9s;
  }
  #fade.on { opacity: 1; }

  /* ---- Title / end cards ---- */
  .card {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 70%, rgba(255,170,90,.25), rgba(20,24,48,.55) 70%);
    transition: opacity 1.4s;
  }
  .card.gone { opacity: 0; pointer-events: none; }
  .card h1 {
    margin: 0; font-weight: normal; letter-spacing: .32em; font-size: clamp(28px, 7vw, 56px);
    text-shadow: 0 2px 18px rgba(255, 160, 80, .6); padding-left: .32em;
  }
  .card .rule { width: 120px; height: 1px; margin: 18px auto; background: var(--glass-edge); }
  .card .dots { display: flex; gap: 14px; justify-content: center; }
  .card .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember); }
  #begin {
    margin-top: 36px; width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid var(--glass-edge); background: var(--glass); cursor: pointer;
    display: inline-grid; place-items: center; animation: breathe 2.2s ease-in-out infinite;
  }
  #begin svg { width: 34px; height: 34px; }
  #loading { position: fixed; bottom: 24px; width: 100%; text-align: center; opacity: .5; font-size: 13px; letter-spacing: .2em; }
  #end .time { margin-top: 10px; opacity: .75; letter-spacing: .2em; font-size: 15px; }
  #end { background: radial-gradient(ellipse at 50% 60%, rgba(255,200,120,.18), rgba(8,12,30,.35) 70%); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="lights"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="act" aria-label="Interact">
    <svg viewBox="0 0 48 48" fill="none" stroke="#fff4dc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 6c5 7 11 12 11 21a11 11 0 0 1-22 0c0-5 3-8 5-11 1 4 3 6 5 6-1-6 0-11 1-16z" />
    </svg>
  </button>
  <button id="mute" aria-label="Sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff4dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6h4l5 4V5L8 9z" /><path id="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" />
    </svg>
  </button>
</div>

<div id="fade"></div>

<div class="card" id="title">
  <div>
    <h1>FIVE LIGHTS</h1>
    <div class="rule"></div>
    <div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
    <button id="begin" aria-label="Begin">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff4dc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 6c5 7 11 12 11 21a11 11 0 0 1-22 0c0-5 3-8 5-11 1 4 3 6 5 6-1-6 0-11 1-16z" />
      </svg>
    </button>
  </div>
</div>
<div id="loading">· · ·</div>

<div class="card gone" id="end">
  <div>
    <h1>FIVE LIGHTS</h1>
    <div class="rule"></div>
    <div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="time" id="endtime"></div>
  </div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
