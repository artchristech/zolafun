<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Lights</title>
<style>
  :root { --ink: #fff7e6; --shade: rgba(20, 16, 12, 0.55); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f1c; }
  canvas#c { display: block; width: 100vw; height: 100vh; outline: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: Georgia, 'Times New Roman', serif; }
  .glyph { position: absolute; transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.18s; }
  .glyph.show { opacity: 1; }
  .glyph .kb, .glyph .pad { display: none; }
  .glyph.dev-kb .kb, .glyph.dev-pad .pad { display: flex; }
  .kb { width: 34px; height: 34px; border-radius: 7px; background: #f4ecd8; color: #2b2118; font: bold 19px/1 system-ui, sans-serif;
        align-items: center; justify-content: center; box-shadow: 0 3px 0 #9c8b6c, 0 5px 10px rgba(0,0,0,0.45); border: 2px solid #2b2118; }
  .pad { width: 36px; height: 36px; border-radius: 50%; background: #3fa34d; color: #fff; font: bold 19px/1 system-ui, sans-serif;
         align-items: center; justify-content: center; box-shadow: 0 3px 0 #22662b, 0 5px 10px rgba(0,0,0,0.45); border: 2px solid #163d1b; }
  .glyph.hold::after { content: ''; position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
         border: 3px dashed rgba(255, 240, 210, 0.8); animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #fps { position: absolute; left: 10px; top: 8px; color: #e8f0ff; font: 12px/1.3 ui-monospace, monospace; background: rgba(0,0,0,0.45);
         padding: 3px 7px; border-radius: 4px; display: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
             background: radial-gradient(ellipse at 50% 60%, rgba(255, 190, 120, 0.12), rgba(8, 10, 22, 0.55)); cursor: pointer;
             transition: opacity 1.2s; }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay h1 { margin: 0; color: var(--ink); font-weight: normal; font-size: 64px; letter-spacing: 0.18em; text-shadow: 0 2px 24px rgba(255, 160, 80, 0.6); }
  .lights { display: flex; gap: 18px; }
  .lights span { width: 12px; height: 12px; border-radius: 50%; background: #ffcf7a; box-shadow: 0 0 14px 4px rgba(255, 170, 70, 0.8); animation: flick 2.8s ease-in-out infinite; }
  .lights span:nth-child(2) { animation-delay: 0.3s; } .lights span:nth-child(3) { animation-delay: 0.6s; }
  .lights span:nth-child(4) { animation-delay: 0.9s; } .lights span:nth-child(5) { animation-delay: 1.2s; }
  @keyframes flick { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .starts { display: flex; gap: 26px; align-items: center; animation: flick 2.4s ease-in-out infinite; }
  .mouse { width: 26px; height: 40px; border: 3px solid var(--ink); border-radius: 14px; position: relative; }
  .mouse::before { content: ''; position: absolute; left: 0; right: 50%; top: 0; height: 15px; background: var(--ink); border-radius: 11px 0 0 0; }
  .mouse::after { content: ''; position: absolute; left: 0; right: 0; top: 15px; border-top: 2px solid var(--ink); }
  .sep { width: 2px; height: 34px; background: rgba(255, 247, 230, 0.35); }
  .starts .kb, .starts .pad { display: flex; }
  #loading { color: rgba(255, 247, 230, 0.7); height: 4px; width: 180px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
  #loading div { height: 100%; width: 0%; background: #ffcf7a; transition: width 0.2s; }
  #muted { position: absolute; right: 16px; bottom: 16px; display: none; align-items: center; gap: 10px; opacity: 0.85; }
  #muted svg { width: 30px; height: 30px; }
  #mousehint { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: none; opacity: 0.7; }
  #end { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); opacity: 0; transition: opacity 3s; }
  #end.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hud">
  <div id="prompt" class="glyph dev-kb"><div class="kb">E</div><div class="pad">A</div></div>
  <div id="fps"></div>
  <div id="muted"><svg viewBox="0 0 24 24" fill="none" stroke="#fff7e6" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff7e6"/><path d="M17 9l5 6M22 9l-5 6"/></svg><div class="mouse" style="transform:scale(0.7)"></div></div>
  <div id="mousehint"><div class="mouse"></div></div>
  <div id="end"><div class="lights"><span></span><span></span><span></span><span></span><span></span></div></div>
</div>
<div id="overlay">
  <h1>FIVE LIGHTS</h1>
  <div class="lights"><span></span><span></span><span></span><span></span><span></span></div>
  <div id="loading"><div></div></div>
  <div class="starts" id="starts" style="visibility:hidden"><div class="mouse"></div><div class="kb">E</div><div class="sep"></div><div class="pad">A</div></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
