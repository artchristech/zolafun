<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Lights</title>
<style>
  :root { --gold: #ffd27a; --ink: #2a2118; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  #title { display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.4s ease; pointer-events: auto; cursor: pointer;
    background: radial-gradient(ellipse at 50% 55%, rgba(10,14,30,0) 30%, rgba(10,14,30,0.45) 100%); }
  #title.hidden { opacity: 0; pointer-events: none; }
  #title h1 { margin: 0; font: 400 clamp(38px, 7vw, 76px) Georgia, 'Times New Roman', serif; letter-spacing: 0.22em; text-indent: 0.22em;
    color: #fff6e2; text-shadow: 0 2px 18px rgba(80, 40, 10, 0.55), 0 0 2px rgba(0,0,0,0.4); }
  .dots { display: flex; gap: 20px; margin: 22px 0 0; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: #ffe0a0; box-shadow: 0 0 14px 4px rgba(255, 170, 70, 0.75); }
  .dots.loading .dot { animation: pulse 1.4s infinite ease-in-out; }
  .dots.loading .dot:nth-child(2) { animation-delay: .15s } .dots.loading .dot:nth-child(3) { animation-delay: .3s }
  .dots.loading .dot:nth-child(4) { animation-delay: .45s } .dots.loading .dot:nth-child(5) { animation-delay: .6s }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8) } 50% { opacity: 1; transform: scale(1) } }
  #startGlyphs { display: flex; gap: 26px; align-items: center; margin-top: 54px; opacity: 0; transition: opacity 1s; }
  #startGlyphs.on { opacity: 1; animation: breathe 2.6s infinite ease-in-out; }
  @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
  #startGlyphs svg { width: 58px; height: 58px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
  #restart { position: absolute; right: 36px; bottom: 34px; width: 74px; height: 74px; display: none; pointer-events: auto; cursor: pointer; }
  #restart svg { width: 100%; height: 100%; }
  #restart .pad { position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; display: none; }
  #prompt { position: fixed; left: 0; top: 0; width: 52px; height: 52px; margin: -26px 0 0 -26px; opacity: 0; transition: opacity .18s; pointer-events: none; will-change: transform; }
  #prompt svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  #prompt svg { display: none; } #prompt.kbm .k { display: block; } #prompt.pad .p { display: block; }
  #fade { background: #04060d; opacity: 0; transition: opacity 2.2s ease; }
  #closing { display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 2.4s ease; }
  #closing .dots { gap: 34px; } #closing .dot { width: 18px; height: 18px; }
  #closing .time { margin-top: 46px; font: 300 44px Georgia, serif; letter-spacing: .18em; color: #f6e8c8; font-variant-numeric: tabular-nums; }
  #pause { display: flex; align-items: center; justify-content: center; background: rgba(6, 10, 22, .35); opacity: 0; transition: opacity .3s; }
  #pause.on { opacity: 1; pointer-events: auto; cursor: pointer; }
  #pause svg { width: 64px; height: 64px; }
  #stats { position: fixed; left: 10px; top: 10px; padding: 7px 10px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #e8f0ff;
    background: rgba(0, 0, 0, .55); border-radius: 6px; display: none; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="g-e" viewBox="0 0 48 48"><rect x="4" y="5" width="40" height="38" rx="8" fill="#f6efdf" stroke="#3a3024" stroke-width="3"/><rect x="8" y="9" width="32" height="27" rx="5" fill="#fffaf0"/><path d="M18 14h13M18 22.5h10M18 31h13M18 14v17" stroke="#3a3024" stroke-width="3.6" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="g-a" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#3aa64b" stroke="#1d5d27" stroke-width="2.5"/><path d="M16 33l8-19 8 19M19.2 26h9.6" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="g-y" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#e8b425" stroke="#8a6512" stroke-width="2.5"/><path d="M16.5 14l7.5 10 7.5-10M24 24v10" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="g-m" viewBox="0 0 48 48"><rect x="11" y="4" width="26" height="40" rx="13" fill="#f6efdf" stroke="#3a3024" stroke-width="3"/><path d="M24 5v15" stroke="#3a3024" stroke-width="2.5"/><path d="M13 17a11 11 0 0 1 11-12v15h-11z" fill="#e0a43a"/><path d="M11 20h26" stroke="#3a3024" stroke-width="2.5"/></symbol>
  </defs>
</svg>
<div id="title" class="layer">
  <h1>Five Lights</h1>
  <div class="dots loading" id="titleDots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div id="startGlyphs"><svg><use href="#g-a"/></svg><svg><use href="#g-m"/></svg></div>
  <div id="restart">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="rgba(10,14,28,.45)" stroke="rgba(255,240,210,.35)" stroke-width="3"/>
      <circle id="restartRing" cx="32" cy="32" r="28" fill="none" stroke="#ffd27a" stroke-width="4" stroke-dasharray="175.9" stroke-dashoffset="175.9" transform="rotate(-90 32 32)"/>
      <path d="M43 25a13 13 0 1 0 2 11" fill="none" stroke="#fff6e2" stroke-width="4" stroke-linecap="round"/>
      <path d="M45 15v11h-11" fill="none" stroke="#fff6e2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="pad"><use href="#g-y"/></svg>
  </div>
</div>
<div id="prompt" class="kbm"><svg class="k"><use href="#g-e"/></svg><svg class="p"><use href="#g-a"/></svg></div>
<div id="pause" class="layer"><svg><use href="#g-m"/></svg></div>
<div id="fade" class="layer"></div>
<div id="closing" class="layer">
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="time" id="closingTime"></div>
</div>
<div id="stats"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
