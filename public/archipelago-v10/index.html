<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Lights</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1c; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hidden { display: none !important; }
  #title { background: linear-gradient(to bottom, rgba(10,12,30,0.0) 0%, rgba(10,12,30,0.0) 55%, rgba(10,12,30,0.55) 100%); transition: opacity 1.2s ease; cursor: pointer; }
  #title.gone { opacity: 0; pointer-events: none; }
  #title .name { margin-top: 38vh; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(42px, 7vw, 96px); color: #fff4e0; letter-spacing: 0.06em; text-shadow: 0 2px 0 rgba(90,40,20,0.55), 0 0 40px rgba(255,180,90,0.55); font-style: italic; }
  #title .dots { display: flex; gap: 18px; margin: 18px 0 30px; }
  #title .dots i, #cardLights i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #fff3c0 0%, #ffb347 45%, rgba(255,120,40,0) 75%); box-shadow: 0 0 18px 6px rgba(255,160,60,0.55); display: block; animation: pulse 2.4s ease-in-out infinite; }
  #title .dots i:nth-child(2) { animation-delay: .3s } #title .dots i:nth-child(3) { animation-delay: .6s } #title .dots i:nth-child(4) { animation-delay: .9s } #title .dots i:nth-child(5) { animation-delay: 1.2s }
  @keyframes pulse { 0%,100% { transform: scale(0.85); opacity: .75 } 50% { transform: scale(1.15); opacity: 1 } }
  #tGlyphs, #pGlyphs { display: flex; gap: 14px; align-items: center; }
  .g { width: 54px; height: 54px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.45)); }
  #tGlyphs .g { animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  #loading { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(255,240,210,0.2); border-top-color: #ffcf7a; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  #restart { position: fixed; right: 28px; bottom: 26px; width: 64px; height: 64px; cursor: pointer; }
  #restart .rs { width: 64px; height: 64px; }
  #restart .rsy { position: absolute; left: -38px; top: 18px; }
  #restart .rsy .g { width: 30px; height: 30px; }
  #pause { background: rgba(8,10,24,0.45); gap: 22px; cursor: pointer; }
  #pause .big { width: 110px; height: 110px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
  #prompt { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform; }
  #prompt .g { width: 46px; height: 46px; animation: bob 1.4s ease-in-out infinite; }
  #stats { position: fixed; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: rgba(8,10,20,0.6); border-radius: 8px; color: #ffe9c0; font: 600 13px/1 ui-monospace, Menlo, Consolas, monospace; pointer-events: none; }
  #stats span { display: flex; align-items: center; gap: 8px; }
  #stats .i { width: 16px; height: 16px; color: #ffcf7a; }
  #card { background: #05070f; gap: 40px; transition: opacity 1s; }
  #cardLights { display: flex; gap: 34px; }
  #cardLights i { width: 26px; height: 26px; box-shadow: 0 0 30px 12px rgba(255,160,60,0.6); }
  #cardTime { font-family: Georgia, serif; font-size: 44px; color: #fff1d6; letter-spacing: 0.12em; text-shadow: 0 0 20px rgba(255,170,80,0.5); }
  #fade { position: fixed; inset: 0; background: #05070f; opacity: 1; pointer-events: none; transition: opacity 0.12s linear; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="fade"></div>
<div id="title" class="overlay">
  <div class="name">Five Lights</div>
  <div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="loading"></div>
  <div id="tGlyphs" class="hidden"></div>
  <div id="restart" class="hidden"></div>
</div>
<div id="pause" class="overlay hidden"><div class="playIcon"></div><div id="pGlyphs"></div></div>
<div id="prompt" class="hidden"></div>
<div id="stats" class="hidden"></div>
<div id="card" class="overlay hidden"><div id="cardLights"></div><div id="cardTime"></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
