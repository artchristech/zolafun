<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Beacons</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1420; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
        background: radial-gradient(ellipse at center, rgba(20,10,30,0.05) 0%, rgba(20,10,30,0.55) 100%); transition: opacity 0.9s; user-select: none; cursor: pointer; }
  .ov.hide { opacity: 0; pointer-events: none; }
  #title.loading .ready { opacity: 0; pointer-events: none; }
  #title:not(.loading) .spin { display: none; }
  .ready { transition: opacity 0.8s; display: flex; flex-direction: column; align-items: center; gap: 5vh; }
  .emblem { width: min(30vw, 220px); filter: drop-shadow(0 4px 18px rgba(255,170,80,0.5)); }
  .glyphs { display: flex; gap: 28px; align-items: center; animation: pulse 2.2s ease-in-out infinite; }
  .glyphs svg { width: 74px; height: 74px; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5)); }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
  .spin svg { width: 60px; height: 60px; animation: rot 1.2s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #restart { position: relative; width: 66px; height: 66px; cursor: pointer; opacity: 0.8; display: none; }
  #restart.show { display: block; }
  #restart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #restart .dev { position: absolute; right: -30px; bottom: -6px; width: 30px; height: 30px; }
  #prompt { position: fixed; left: 0; top: 0; width: 54px; height: 54px; pointer-events: none; opacity: 0; transition: opacity 0.2s; will-change: transform; }
  #prompt.show { opacity: 1; }
  #prompt svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .pad .kb, .kb .pad { display: none; }
  #stats { position: fixed; left: 8px; top: 8px; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #e8f0ff; background: rgba(0,0,0,0.55);
           padding: 6px 9px; border-radius: 6px; white-space: pre; display: none; pointer-events: none; }
  #stats.show { display: block; }
  #fade { position: fixed; inset: 0; background: #000; pointer-events: none; opacity: 1; transition: opacity 1.6s; }
  #fade.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="g-key-e">
      <rect x="6" y="8" width="52" height="50" rx="10" fill="#2a2632" stroke="#f4ead6" stroke-width="3"/>
      <rect x="10" y="10" width="44" height="40" rx="8" fill="#3a3544"/>
      <path d="M24 19 h17 M24 19 v22 h17 M24 30 h13" stroke="#f4ead6" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="g-key-r">
      <rect x="6" y="8" width="52" height="50" rx="10" fill="#2a2632" stroke="#f4ead6" stroke-width="3"/>
      <rect x="10" y="10" width="44" height="40" rx="8" fill="#3a3544"/>
      <path d="M25 42 V19 h9 a6.5 6.5 0 0 1 0 13 h-9 M33 32 l8 10" stroke="#f4ead6" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="g-pad-a">
      <circle cx="32" cy="32" r="27" fill="#1f8a3a" stroke="#eaffea" stroke-width="3"/>
      <path d="M21 44 L32 19 L43 44 M25.5 35 h13" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="g-pad-y">
      <circle cx="32" cy="32" r="27" fill="#c9a01e" stroke="#fff6d8" stroke-width="3"/>
      <path d="M22 19 L32 32 L42 19 M32 32 V45" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="g-click">
      <rect x="14" y="5" width="36" height="54" rx="18" fill="#2a2632" stroke="#f4ead6" stroke-width="3"/>
      <path d="M32 5 V27 M14 27 H50" stroke="#f4ead6" stroke-width="2.5"/>
      <path d="M16 25 V22 A16 16 0 0 1 31 6.5 V25 Z" fill="#ffb347"/>
    </g>
  </defs>
</svg>

<div id="title" class="ov loading">
  <div class="spin"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" stroke="#ffcf8a" stroke-width="5" fill="none" stroke-dasharray="40 200" stroke-linecap="round"/></svg></div>
  <div class="ready">
    <svg class="emblem" viewBox="0 0 200 200">
      <defs><radialGradient id="eg" cx="50%" cy="28%" r="60%"><stop offset="0" stop-color="#fff2c8"/><stop offset="0.25" stop-color="#ffb347" stop-opacity="0.8"/><stop offset="1" stop-color="#ff7a30" stop-opacity="0"/></radialGradient></defs>
      <circle cx="100" cy="62" r="90" fill="url(#eg)"/>
      <g stroke="#ffe6b0" stroke-width="2" opacity="0.8"><path d="M100 60 L20 30 M100 60 L180 30 M100 60 L35 92 M100 60 L165 92"/></g>
      <path d="M86 172 L90 74 H110 L114 172 Z" fill="#f4f1ea"/>
      <path d="M88.6 140 L89.3 120 H110.7 L111.4 140 Z M87.2 172 L87.9 156 H112.1 L112.8 172 Z M90 100 L90.7 86 H109.3 L110 100 Z" fill="#d42a22"/>
      <rect x="84" y="68" width="32" height="6" fill="#2a2a2a"/>
      <path d="M90 68 V52 H110 V68" fill="none" stroke="#2a2a2a" stroke-width="3"/>
      <circle cx="100" cy="60" r="6" fill="#fff6dc"/>
      <path d="M88 52 Q100 36 112 52 Z" fill="#c42a22"/>
      <path d="M10 176 Q50 166 100 174 T190 172 V200 H10 Z" fill="#1d4f66"/>
      <g fill="#ffcf6a"><circle cx="24" cy="168" r="3.5"/><circle cx="54" cy="160" r="3.5"/><circle cx="148" cy="161" r="3.5"/><circle cx="178" cy="167" r="3.5"/></g>
    </svg>
    <div class="glyphs">
      <svg viewBox="0 0 64 64"><use href="#g-pad-a"/></svg>
      <svg viewBox="0 0 64 64"><use href="#g-click"/></svg>
    </div>
    <div id="restart">
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="28" fill="rgba(20,16,28,0.6)" stroke="rgba(244,234,214,0.35)" stroke-width="3"/>
        <circle id="holdring" cx="32" cy="32" r="28" fill="none" stroke="#ffb347" stroke-width="4" stroke-dasharray="0 200" transform="rotate(-90 32 32)" stroke-linecap="round"/>
        <path d="M44 24 A14 14 0 1 0 46 36" fill="none" stroke="#f4ead6" stroke-width="4" stroke-linecap="round"/>
        <path d="M46 14 V25 H35" fill="none" stroke="#f4ead6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="dev" viewBox="0 0 64 64"><use id="restartdev" href="#g-key-r"/></svg>
    </div>
  </div>
</div>

<div id="pause" class="ov hide">
  <div class="glyphs">
    <svg viewBox="0 0 64 64"><use href="#g-pad-a"/></svg>
    <svg viewBox="0 0 64 64"><use href="#g-click"/></svg>
  </div>
</div>

<div id="prompt" class="kb">
  <svg viewBox="0 0 64 64" class="kb"><use href="#g-key-e"/></svg>
  <svg viewBox="0 0 64 64" class="pad"><use href="#g-pad-a"/></svg>
</div>
<div id="stats"></div>
<div id="fade"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
