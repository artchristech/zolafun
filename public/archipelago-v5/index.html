<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Lights</title>
<style>
  :root { --ink: #fff7e8; --shade: rgba(20, 16, 30, 0.55); }
  html, body { margin: 0; height: 100%; background: #0b0d18; overflow: hidden; }
  canvas#c { display: block; width: 100vw; height: 100vh; outline: none; }
  .ui { position: fixed; pointer-events: none; user-select: none; }
  #title { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12vh 0 10vh; pointer-events: auto; cursor: pointer; transition: opacity 1.2s ease; }
  #title.gone { opacity: 0; pointer-events: none; }
  #title h1 { margin: 0; font: italic 400 clamp(44px, 8vw, 104px)/1 Georgia, 'Times New Roman', serif; color: var(--ink); letter-spacing: 0.04em; text-shadow: 0 0 28px rgba(255, 170, 80, 0.75), 0 2px 0 rgba(90, 40, 20, 0.6); }
  #title .row { display: flex; gap: 28px; align-items: center; opacity: 0; transition: opacity 1s ease; }
  #title.ready .row { opacity: 1; }
  #title .row svg { width: 64px; height: 64px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  #restart { position: fixed; right: 4vw; bottom: 6vh; width: 74px; height: 74px; cursor: pointer; pointer-events: auto; opacity: 0; transition: opacity 1s ease; }
  #title.ready #restart.has { opacity: 0.85; }
  #title.gone #restart { pointer-events: none; }
  #restart svg { width: 100%; height: 100%; }
  #restart .sub { position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; }
  #prompt { left: 0; top: 0; width: 46px; height: 46px; transform: translate(-50%, -100%); opacity: 0; transition: opacity 0.2s ease; }
  #prompt.on { opacity: 1; }
  #prompt svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
  #lockhint { left: 50%; bottom: 5vh; width: 44px; height: 44px; transform: translateX(-50%); opacity: 0; transition: opacity 0.4s; }
  #lockhint.on { opacity: 0.8; }
  #stats { left: 10px; top: 10px; padding: 6px 9px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #e8f4ff; background: var(--shade); border-radius: 6px; display: none; white-space: pre; }
  #fade { inset: 0; background: #000; opacity: 1; transition: opacity 1.5s ease; }
  #fade.clear { opacity: 0; }
  #endmark { left: 50%; top: 18vh; transform: translateX(-50%); font: italic 400 clamp(36px, 6vw, 72px)/1 Georgia, serif; color: var(--ink); text-shadow: 0 0 30px rgba(255,190,110,0.9); opacity: 0; transition: opacity 4s ease; }
  #endmark.on { opacity: 0.9; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="title" class="ui">
  <h1>Five Lights</h1>
  <div class="row" id="startRow"></div>
  <div id="restart"></div>
</div>
<div id="prompt" class="ui"></div>
<div id="lockhint" class="ui"></div>
<div id="endmark" class="ui">Five Lights</div>
<div id="stats" class="ui"></div>
<div id="fade" class="ui"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
